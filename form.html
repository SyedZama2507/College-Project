    <h1 align="center" color="black">Contact Us</h1>
    <form action="" method="post">
        <table align="center" cellspacing=10 cellpadding="10"
        bgcolor="white" width="70%">
            
            <tr>
                <td><b>Name</b></td>
                <td><input type=text name=name id=name autofocus required></td>
            <tr>
                <td><b>Email</b></td>
                <td><input type="email" name=mail id=mail></td>
            </tr>
            <tr>
                <td><b>Phone</b></td>
                <td><input type="tel" name=phone id=phone maxlength="10"></td>
            </tr>
            <tr>
                <td><b>Gender</b></td>
                <td><input type="radio" name=gen id=gen value="male">Male
                <input type="radio" name=gen id=gen value=Female>Female</td>
            </tr>
            <tr>
                <td><b>Programs</b></td><br>
                <td><input type="checkbox" name=c1 id=c1 value="PUC">PUC<br>
                <input type="checkbox" name=c2 id=c2 value="Under-Graduate">Under-Graduate<br>
                <input type="checkbox" name=c3 id=c3 value="Post-Graduate">Post-Graduate<br>
                <input type="checkbox" name=c3 id=c3 value="Nursing">Nursing
            </td>
               
            </tr>
            <tr>
                <td><b>DOB</b></td>
                <td><input type="date" name=dob id=dob min="1990-10-10" max="2010-10-10"></td>
            </tr>
            
                <td><b>Address</b></td>
                <td><textarea name=addr id=addr rows="10" cols="30"></textarea></td>
            </tr>
            
            <tr>
                <td><b>Country</b></td>
                <td><select name=country id=country>
                    <option>--- Select Your Country ---</option>

                    <option value="India">UK</option>
                    <option value="India">Japan</option>
                    <option value="India">Srilanka</option>
                </select></td>
            </tr>

            <tr>
                <td><b>state</b></td>

                    <option>--- Select Your State ---</option>

                    <option value="Karnataka">KarnatakaK</option>
                    <option value="Goa">Goa</option>
                    <option value="Rajastan">Rajastan</option>
                </select></td>
            </tr>
